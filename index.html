<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
fetch("./blogs/test.md")
  .then(response => response.text())
  .then(text => {
    document.getElementById("content").innerHTML = marked.parse(text);
  });
</script>


<script>
let blogs = [];
let currentPage = 1;
const itemsPerPage = 8;

fetch("./blogs/blogs_data/blogs.json")
  .then(res => res.json())
  .then(data => {
    blogs = data;
    renderPage(currentPage);
  });

function renderPage(page) {
  const listDiv = document.getElementById("blogLsist");
  listDiv.innerHTML = "";

  const start = (page - 1) * itemsPerPage;
  const end = start + itemsPerPage;
  const pageItems = blogs.slice(start, end);

  pageItems.forEach(blog => {
    const item = document.createElement("div");
    item.className = "blog_item";
    item.innerHTML = `
      <h3>${blog.title}</h3>
      <p>${blog.subtitle}</p>
      <small>${blog.date}</small>
    `;
    item.onclick = () => loadPost(blog.file);
    listDiv.appendChild(item);
  });
}

function changePage(page){
  currentPage = page;
  renderPage(page);
}

function loadPost(file){
  fetch(file)
    .then(res => res.text())
    .then(text => {
      document.getElementById("detailbar").innerHTML = marked.parse(text);
    });
}
</script>
